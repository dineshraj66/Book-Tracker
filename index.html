<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book Tracker Pro</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="mainContainer" class="container">
        <div id="libraryView">
            <div class="stats-bar">
                <div class="goal-header">
                    <span>2026 Goal: <strong id="yearCountHeader">0</strong> / <span id="goalDisplay">0</span></span>
                    <button onclick="setGoal()" class="small-btn">Set</button>
                </div>
                <div class="progress-container"><div id="progressBar" class="progress-fill"></div></div>
            </div>
            <div class="input-section">
                <input type="text" id="bookTitle" placeholder="Book Name">
                <input type="text" id="bookAuthor" placeholder="Author">
                <div class="row"><input type="text" id="bookCategory" placeholder="Category"><input type="number" id="totalPages" placeholder="Pages"></div>
                <button onclick="addBook()">Add New Book</button>
            </div>
            <h2 class="section-title">📖 Reading Now</h2>
            <div id="activeList"></div>
            <h2 class="section-title">✅ Finished</h2>
            <div id="historyList"></div>
        </div>
        <div id="statsView" style="display: none;">
            <h2>📊 Performance Stats</h2>
            <div class="stat-card streak"><small>Current Streak</small><h2 id="currentStreak">0 Days</h2></div>
            <div class="stat-card gold"><small>Fastest Completion</small><h3 id="fastestBook">-</h3><span id="fastestDays">0 days</span></div>
            <h3>Monthly Progress</h3>
            <div id="monthlyStats" class="monthly-grid"></div>
        </div>
    </div>
    <nav class="bottom-nav">
        <div onclick="showView('library')">📚 Library</div>
        <div onclick="showView('stats')">📈 Stats</div>
    </nav>
    <script type="module" src="./script.js"></script>
</body>
</html>
